name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run the CLI on the example project
        run: |
          set +e
          node dist/bin.js --cwd test/fixtures/shop --format json > report.json
          code=$?
          set -e
          test "$code" = "1"
          node -e "const r = require('./report.json'); if (r.summary.errors !== 11) process.exit(1)"
